name: Revisión ZAP de Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_url:
        description: URL HTTPS de la Preview validada
        required: true
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  baseline:
    name: Análisis pasivo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Localizar la Preview validada
        id: preview
        uses: actions/github-script@v7
        env:
          MANUAL_PREVIEW_URL: ${{ github.event.inputs.preview_url || '' }}
        with:
          script: |
            let value = process.env.MANUAL_PREVIEW_URL;
            const headSha =
              context.payload.pull_request?.head.sha ?? context.sha;

            for (let attempt = 0; !value && attempt < 30; attempt += 1) {
              const deployments = await github.paginate(
                github.rest.repos.listDeployments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: headSha,
                  environment: "Preview",
                  per_page: 100,
                },
              );

              for (const deployment of deployments) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 100,
                });
                const ready = statuses.data.find(
                  (status) =>
                    status.state === "success" && status.environment_url,
                );
                if (ready?.environment_url) {
                  value = ready.environment_url;
                  break;
                }
              }

              if (!value) {
                await new Promise((resolve) => setTimeout(resolve, 10_000));
              }
            }

            if (!value) {
              core.setFailed("No se encontró un despliegue Preview correcto");
              return;
            }

            const url = new URL(value);
            if (
              url.protocol !== "https:" ||
              url.pathname !== "/" ||
              url.search ||
              url.hash ||
              !url.hostname.endsWith(".vercel.app")
            ) {
              core.setFailed("Solo se permite la raíz HTTPS de una Preview vercel.app");
              return;
            }

            core.setOutput("url", url.origin);
            core.setOutput("host", url.hostname);

      - name: Ejecutar el análisis pasivo contra el host validado
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.preview.outputs.url }}
          cmd_options: >-
            -a
            -j
            -z "-config spider.maxDuration=1
            -config spider.maxDepth=3
            -config spider.postform=false"
          allow_issue_writing: false
          artifact_name: zap-preview-report
