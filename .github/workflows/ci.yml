name: Integración continua

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configurar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Iniciar la base de datos local
        # El buzón de correo local no participa en estas comprobaciones y su
        # puerto puede estar ocupado por servicios preinstalados del runner.
        run: bunx supabase start --exclude inbucket

      - name: Aplicar migraciones y datos iniciales
        run: bunx supabase db reset

      - name: Ejecutar pruebas de base de datos
        run: bunx supabase test db

      - name: Revisar los esquemas de base de datos
        run: bunx supabase db lint --level warning --fail-on error

      - name: Revisar el uso local de índices
        run: bunx supabase inspect db index-stats --local

      - name: Verificar los tipos generados de la base de datos
        run: |
          bunx supabase gen types --lang typescript --local > /tmp/database.types.ts
          diff --strip-trailing-cr --ignore-blank-lines src/lib/supabase/database.types.ts /tmp/database.types.ts

  validate:
    name: Validación
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configurar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Guardar paquetes de Bun en caché
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Revisar el código
        run: bun run lint

      - name: Comprobar los tipos
        run: bun run typecheck

      - name: Ejecutar pruebas unitarias
        run: bun run test

      - name: Auditar dependencias de severidad alta
        run: bun audit --audit-level=high

      - name: Comprobar los límites de datos públicos
        run: bun run security:public-data

      - name: Buscar secretos en archivos e historial
        run: bun run security:secrets

      - name: Comprobar el idioma de la interfaz
        run: bun run content:validate

      - name: Compilar
        run: bun run build

      - name: Instalar Chromium
        run: bunx playwright install --with-deps chromium

      - name: Ejecutar pruebas de extremo a extremo y accesibilidad
        run: bun run e2e
