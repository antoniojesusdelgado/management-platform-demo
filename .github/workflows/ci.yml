name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local database
        run: bunx supabase start

      - name: Apply migrations and seed data
        run: bunx supabase db reset

      - name: Run database tests
        run: bunx supabase test db

      - name: Lint database schemas
        run: bunx supabase db lint --level warning --fail-on error

      - name: Inspect local database index usage
        run: bunx supabase inspect db index-stats --local

      - name: Verify generated database types
        run: |
          bunx supabase gen types --lang typescript --local > /tmp/database.types.ts
          diff --strip-trailing-cr --ignore-blank-lines src/lib/supabase/database.types.ts /tmp/database.types.ts

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Audit high severity dependencies
        run: bun audit --audit-level=high

      - name: Check public demo data boundaries
        run: bun run security:public-data

      - name: Check interface language
        run: bun run content:validate

      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: bun run e2e
